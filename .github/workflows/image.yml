name: image

# amd64 only: a RunPod worker is amd64, and an arm64 variant nobody pulls would double the
# build for nothing. Nothing is compiled here -- iceoryx2 ships a manylinux wheel for the
# Python binding, which is the difference between this image and the C++ half's.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate and the parse need no bus, no GPU and no weights, so they run before
      # anything is built and fail the workflow on their own.
      # The C++ half, so the agreement check has something to compare against. Actions
      # refuses a checkout above the workspace directory, so it lands inside and says where
      # through ST_CPP_ROOT rather than being assumed to be a sibling.
      - uses: actions/checkout@v4
        with:
          repository: v-sekai-multiplayer-fabric/interactor-see-through-cpp
          path: .cpp-half
      - run: python3 proof/test_command.py
      # No iceoryx2 is installed here on purpose. The agreement is pure text and must be
      # answerable on a machine that could not serve a request, which is what
      # weft_harness/agree.py exists to make true.
      - run: python3 proof/test_agreement.py
        env:
          ST_CPP_ROOT: ${{ github.workspace }}/.cpp-half

      # The authoritative check on RFD 0124. The Python reader beside it only establishes that
      # a Python encoder and a Python decoder agree; whether either speaks Elixir is a question
      # only a virtual machine answers, so one runs here.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - run: python3 proof/write_replies.py /tmp/replies
      - run: elixir proof/elixir_compat.exs /tmp/replies

  image:
    needs: proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
